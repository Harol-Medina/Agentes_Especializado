server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: archaeologist-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/archaeologist}
    username: ${SPRING_DATASOURCE_USERNAME:archaeologist}
    password: ${SPRING_DATASOURCE_PASSWORD:archaeologist_secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
