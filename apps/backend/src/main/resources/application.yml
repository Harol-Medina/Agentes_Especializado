server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: archaeologist-backend

  # Force servlet (Tomcat) mode — WebFlux WebClient is used as library only
  main:
    web-application-type: servlet

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/archaeologist}
    username: ${SPRING_DATASOURCE_USERNAME:archaeologist}
    password: ${SPRING_DATASOURCE_PASSWORD:archaeologist_secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

app:
  webhook-secret: ${WEBHOOK_SECRET:shared_webhook_secret}
  webhook-base-url: ${WEBHOOK_BASE_URL:http://backend:8080}

analyzer:
  base-url: ${ANALYZER_BASE_URL:http://analyzer:8000}
  timeout:
    rest-seconds: 10
    stream-seconds: 120

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
