version: 0.2
env:
  variables:
    GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"
phases:
  install:
    runtime-versions:
      java: corretto21
  pre_build:
    commands:
      - echo "Building backend from branch $CODEBUILD_SOURCE_VERSION"
  build:
    commands:
      - cd $CODEBUILD_SRC_DIR/apps/backend && chmod +x gradlew && ./gradlew bootJar --no-daemon -x test
  post_build:
    commands:
      - mkdir -p /tmp/output
      - cp $CODEBUILD_SRC_DIR/apps/backend/build/libs/*.jar /tmp/output/app.jar
      - |
        cat > /tmp/output/Dockerfile << 'EOF'
        FROM eclipse-temurin:21-jre-alpine
        WORKDIR /app
        COPY app.jar app.jar
        EXPOSE 8080
        ENTRYPOINT ["java", "-jar", "app.jar"]
        EOF
artifacts:
  base-directory: /tmp/output
  files:
    - '**/*'
